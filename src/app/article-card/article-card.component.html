@let artContent = article()!;

<mat-card class="article-card">
  <img mat-card-image [src]="artContent.picture" alt="Article image" />
 <mat-card-header >
  <mat-card-title>{{ artContent.title }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>{{ artContent.description }}</p>
    <small>Published: {{ artContent.publishDate | date }}</small>
  </mat-card-content>
</mat-card>
