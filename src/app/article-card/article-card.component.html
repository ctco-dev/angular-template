
<mat-card class="article-card" (click)="goToDetails()">
  <img mat-card-image [src]="article.picture" alt="Article image" />
 <mat-card-header >
  <mat-card-title>{{ article.title }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>{{ article.description }}</p>
    <small>Published: {{ article.publishDate | date }}</small>
  </mat-card-content>
</mat-card>
