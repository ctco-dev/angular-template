<a routerLink="/articles">Back to list</a>
@if (article()) {
    <mat-card>
        <mat-card-header>
            <mat-card-title>{{ article()?.title }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <p>{{ article()?.description }}</p>
        </mat-card-content>
        <mat-card-footer>
            <p>Published on: {{ article()?.publishDate| date }}</p>
        </mat-card-footer>
    </mat-card>
} @else {
    <p>Article not found or loading...</p>
}
