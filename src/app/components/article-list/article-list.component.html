<p>article-list works!</p>
<!-- ?@articles = {{articles()}} -->

@if (loading()){
   <mat-spinner></mat-spinner>
}
@else if (error()) {
    <p class="error-message">Error: {{ error() }}</p>
}
@else {
       @for (eachArticle of articles(); track $index) {
          <app-card [article]="eachArticle"></app-card>
    }
}
